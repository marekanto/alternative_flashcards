<style>
:root {
  --bg: #f8f9fa;
  --sf: #ffffff;
  --sf-trans: rgba(255, 255, 255, 0.85);
  --tx: #111827;
  --mu: #6b7280;
  --ac: #4f46e5;
  --ac-grad: linear-gradient(135deg, #6366f1, #4f46e5);
  --bd: #e5e7eb;
  --shadow: 0 4px 20px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.1);
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --sf: #1c1c1e;
    --sf-trans: rgba(28, 28, 30, 0.85);
    --tx: #f9fafb;
    --mu: #9ca3af;
    --ac: #818cf8;
    --ac-grad: linear-gradient(135deg, #818cf8, #6366f1);
    --bd: #374151;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --sf: #1c1c1e;
  --sf-trans: rgba(28, 28, 30, 0.85);
  --tx: #f9fafb;
  --mu: #9ca3af;
  --ac: #818cf8;
  --ac-grad: linear-gradient(135deg, #818cf8, #6366f1);
  --bd: #374151;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; padding: 0;
  overflow: hidden;
  background: var(--bg); color: var(--tx);
  font: 16px/1.5 -apple-system, system-ui, "Helvetica Neue", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body {
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
main {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 20px; width: 100%; max-width: 600px; margin: 0 auto;
}
nav {
  display: flex; border-top: 1px solid var(--bd); background: var(--sf-trans);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  flex-shrink: 0; width: 100%; z-index: 10;
}
nav button {
  flex: 1; border: 0; background: none; color: var(--mu); padding: 12px 0 10px;
  font-size: 11px; transition: color 0.2s; font-weight: 600; cursor: pointer;
}
nav button b { display: block; font-size: 22px; font-weight: 400; margin-bottom: 4px; transition: transform 0.2s; }
nav button:active b { transform: scale(0.9); }
nav button.on { color: var(--ac); }

input, select, textarea {
  width: 100%; padding: 14px 16px; margin: 0 0 12px; border: 1px solid var(--bd);
  border-radius: 14px; background: var(--sf); color: var(--tx); font: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
textarea { min-height: 90px; resize: vertical; }
button { font: inherit; cursor: pointer; }

.p {
  width: 100%; padding: 16px; border: 0; border-radius: 14px; background: var(--ac-grad);
  color: #fff; font-weight: 700; margin: 6px 0 12px; box-shadow: 0 4px 12px rgba(79,70,229,0.3);
  transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s; display: flex; justify-content: center; align-items: center;
}
.p:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(79,70,229,0.2); }
.p:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
.s {
  padding: 12px 16px; border: 1px solid var(--bd); border-radius: 12px;
  background: var(--sf); color: var(--tx); font-weight: 600; transition: background 0.2s;
  display: flex; justify-content: center; align-items: center;
}
.s:active { background: var(--bd); }

.c { background: var(--sf); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card {
  background: var(--sf); border-radius: 24px; padding: 32px 24px; min-height: 280px;
  text-align: center; display: flex; flex-direction: column; justify-content: center;
  box-shadow: var(--shadow-lg); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  position: relative; overflow: hidden;
}
.card:active { transform: scale(0.98); }
.f { font-size: 32px; font-weight: 500; word-break: break-word; overflow-wrap: anywhere; hyphens: auto; letter-spacing: -0.02em; margin: 0; line-height: 1.25; }
.b { font-size: 24px; color: var(--ac); word-break: break-word; overflow-wrap: anywhere; hyphens: auto; font-weight: 500; margin-top: 8px; line-height: 1.3; }
.sentence { font-size: 24px; line-height: 1.5; word-break: break-word; overflow-wrap: anywhere; hyphens: auto; font-weight: 500;}
.blank { font-weight: 700; letter-spacing: 2px; border-bottom: 3px solid var(--ac); }
.hint, .prog, .mu { color: var(--mu); font-size: 14px; font-weight: 500;}
hr { width: 80%; border: 0; border-top: 1px dashed var(--bd); margin: 24px auto; }

.g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
.g button {
  padding: 16px 0; border: 0; border-radius: 14px; color: #fff; font-weight: 700;
  font-size: 14px; transition: transform 0.1s, opacity 0.1s;
}
.g button:active { transform: scale(0.95); opacity: 0.8; }

.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.it { display: flex; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--bd); }
.it div { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.it button { border: 0; background: none; font-size: 20px; padding: 8px; cursor: pointer; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.chips button {
  padding: 8px 14px; border: 1px solid var(--ac); border-radius: 20px; background: none;
  color: var(--ac); font-size: 14px; transition: background 0.2s; font-weight: 600; cursor: pointer;
}
.chips button:active { background: rgba(79,70,229,0.1); }

.bars { display: flex; align-items: flex-end; gap: 4px; height: 100px; }
.bars div { flex: 1; text-align: center; font-size: 11px; color: var(--mu); position: relative;}
.bars i { display: block; background: var(--ac-grad); border-radius: 6px 6px 0 0; min-height: 2px; }
.n { font-size: 32px; font-weight: 800; letter-spacing: -1px;}
.st { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
@media(max-width: 400px) { .st { grid-template-columns: repeat(2, 1fr); } }

#t {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 100px;
  background: rgba(17, 24, 39, 0.9); color: #fff; padding: 12px 24px; border-radius: 30px;
  display: none; font-size: 14px; font-weight: 500; backdrop-filter: blur(8px); z-index: 100;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: slideUp 0.3s ease; text-align: center; white-space: nowrap;
}
@keyframes slideUp { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
a { color: var(--ac); text-decoration: none; font-weight: 600; }
h2 { margin: 0 0 20px; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
h3 { margin: 20px 0 10px; font-size: 18px; font-weight: 700; }

/* Details / Summary */
details.collapse-box { background: var(--sf); border-radius: 20px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
details.collapse-box summary {
  cursor: pointer; font-weight: 700; color: var(--ac); font-size: 16px; outline: none;
  list-style: none; display: flex; align-items: center; gap: 8px;
}
details.collapse-box summary::-webkit-details-marker { display: none; }
details.collapse-box summary::before { content: '▶'; font-size: 12px; transition: transform 0.2s; }
details.collapse-box[open] summary::before { transform: rotate(90deg); }
details.collapse-box > div { margin-top: 16px; }

.info-icon {
  display:inline-flex; justify-content:center; align-items:center;
  width:16px; height:16px; border-radius:50%;
  background:var(--mu); color:var(--bg);
  font-size:10px; font-weight:bold; cursor:pointer;
  margin-left:4px; vertical-align:middle; user-select:none;
}

.progress-bar-container { position: relative; height: 30px; margin-bottom: 12px; }
.house { position: absolute; right: 0; bottom: -4px; font-size: 24px; }
.track { position: absolute; left: 0; right: 30px; top: 50%; transform: translateY(-50%); height: 6px; background: var(--bd); border-radius: 3px; }
.pet { position: absolute; top: 50%; transform: translate(-50%, -50%) scaleX(-1); font-size: 26px; transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 2; }

@keyframes levelPulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); color: #f59e0b; } 100% { transform: scale(1); } }
.level-up-anim { animation: levelPulse 1s ease 3; display: inline-block; }

.tabs { display: flex; gap: 10px; margin-bottom: 16px; }
.tabs button { flex: 1; padding: 10px; border: 1px solid var(--bd); border-radius: 12px; background: var(--sf); font-weight: 600; color: var(--mu); }
.tabs button.on { background: var(--ac); color: #fff; border-color: var(--ac); }

body.reviewing main { max-width: none; padding: clamp(16px, 4vw, 42px); display: flex; flex-direction: column; }
body.reviewing #v { width: 100%; max-width: 900px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; justify-content: safe center; overflow-y: auto; }
body.reviewing .card { flex: 1; min-height: 50vh; overflow-y: auto; font-size: 1.15em; }
body.reviewing .card .f { font-size: clamp(32px, 6vw, 56px); }
body.reviewing .card .b { font-size: clamp(26px, 5vw, 44px); }
.review-image { display: block; max-width: 100%; max-height: 32vh; object-fit: contain; margin: 20px auto 0; border-radius: 16px; box-shadow: var(--shadow); }
body.reviewing nav { display: none; }
body.reviewing #t { bottom: 20px; }

#md, #login {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 20px; z-index: 50; overflow-y: auto;
}
#md { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.mb, #login .box {
  background: var(--sf); border-radius: 24px; padding: 28px; width: 100%; max-width: 420px;
  box-shadow: var(--shadow-lg); margin: auto; animation: scaleUp 0.2s ease;
}
@keyframes scaleUp { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

.mb.long { max-height: 80vh; overflow-y: auto; }
.mb h3 { margin-top: 0; font-size: 22px; }
.mb p, .mb ul { font-size: 15px; line-height: 1.6; color: var(--tx); }
.mb ul { padding-left: 20px; margin-bottom: 16px; }
.mb li { margin-bottom: 8px; }

#login { background: var(--bg); z-index: 60; }
#login .box { max-width: 400px; padding: 36px; border-radius: 28px; }
body.locked main, body.locked nav { display: none; }
body.locked #t { display: none !important; }

.pass-wrap { position: relative; }
.pass-wrap input { padding-right: 48px; margin-bottom: 16px;}
.pass-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-65%); border: 0; background: none; font-size: 20px; cursor: pointer; opacity: 0.5; padding: 4px;}

.fbx-fab {
  position: fixed; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); right: 20px; z-index: 9998;
  display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px;
  border: 0; border-radius: 50px; background: linear-gradient(135deg, #4f46e5, #7c3aed);
  color: #fff; font: 600 14px/1 system-ui, sans-serif; cursor: pointer;
  box-shadow: 0 6px 24px rgba(79, 70, 229, .35); transition: transform .15s ease, box-shadow .15s ease;
}
body.reviewing .fbx-fab { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.fbx-fab:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(79,70,229,.45); }

.fbx-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(15, 23, 42, .55); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; }
.fbx-overlay[hidden] { display: none; }
.fbx-modal { background: #fff; border-radius: 16px; padding: 28px; width: min(520px, 100%); max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 60px rgba(0,0,0,.35); color: #0f172a; position: relative; }
.fbx-modal h2 { margin: 0 0 20px; font-size: 20px; font-weight: 700; }
.fbx-close { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: #f1f5f9; color: #475569; font-size: 18px; cursor: pointer; }
.fbx-field textarea { width: 100%; padding: 11px 13px; border: 1.5px solid #e2e8f0; border-radius: 10px; color: #0f172a; background: #f8fafc; min-height: 120px; resize: vertical; }
.fbx-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
.fbx-btn { padding: 10px 20px; border: 0; border-radius: 10px; font: 600 14px/1 inherit; cursor: pointer; }
.fbx-cancel { background: #f1f5f9; color: #475569; }
.fbx-submit { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; }
.fbx-status { margin-top: 12px; font-size: 13px; min-height: 18px; color: #475569; }
.fbx-status.ok { color: #15803d; font-weight: 600; }
.fbx-status.err { color: #b91c1c; font-weight: 600; }

@media (prefers-color-scheme: dark) {
  .fbx-modal { background: #1e293b; color: #e2e8f0; }
  .fbx-modal h2 { color: #f1f5f9; }
  .fbx-field textarea { background: #0f172a; color: #e2e8f0; border-color: #334155; }
  .fbx-cancel { background: #334155; color: #cbd5e1; }
  .fbx-close { background: #334155; color: #cbd5e1; }
}

function getLevelInfo(xp) {
  let lvl = 1, req = 100, tempXp = xp;
  while (tempXp >= req) { tempXp -= req; lvl++; req += 50; }
  return { level: lvl, currentXp: tempXp, nextLevelXp: req };
}

function fitSize(text, base) { const len=(text||'').length; if(len<=12) return base+'px'; if(len<=20) return Math.round(base*.78)+'px'; if(len<=30) return Math.round(base*.62)+'px'; if(len<=45) return Math.round(base*.5)+'px'; if(len<=60) return Math.round(base*.42)+'px'; return Math.round(base*.35)+'px'; }

Sync = {
  client: createSupabaseClient(), user: null, profile: null, timer: 0,
  async init(){
    if(!this.client){showLogin();return}
    try {
      const {data:{session}} = await this.client.auth.getSession();
      this.user = session?.user || null;
      if(this.user) await this.startSession();
      else showLogin();
      this.client.auth.onAuthStateChange(async(_e,s)=>{
        this.user = s?.user || null;
        if(this.user) await this.startSession();
        else showLogin();
      });
    } catch(e) {
      if(S && S.cards && S.cards.length) { this.user={id:'offline',email:'offline'}; hideLogin(); render(); }
      else showLogin();
    }
  },
  async startSession(){
    const {data:prof} = await this.client.from('profiles').select('*').eq('id',this.user.id).maybeSingle();
    this.profile = prof;
    await this.download();
    
    // Opcja A: Pobieranie sumy XP z bazy
    try {
      const {data} = await this.client.from('xp_logs').select('amount').eq('user_id', this.user.id);
      if(data) {
        const serverXp = data.reduce((sum, row) => sum + (row.amount||0), 0);
        S.settings.xp = Math.max(S.settings.xp || 0, serverXp);
        save();
      }
    } catch(e) {}
    
    await this.checkBonuses();
    if(!this.profile) { showNicknameModal(); }
    else { hideLogin(); render(); if(!localStorage.getItem('altcards-tut')) showTutorial(); }
  },
  async download(){
    if(IS_DEV) return;
    const {data} = await this.client.from('app_states').select('state').eq('user_id',this.user.id).maybeSingle();
    if(data?.state){
      S = data.state;
      if(!S.settings)S.settings={...defaults};
      if(!S.daily)S.daily={};
      if(!S.ratings)S.ratings={};
      if(S.settings.xp===undefined)S.settings.xp=0;
      if(!S.settings.pet)S.settings.pet='🐕';
      S.cards.forEach(c=>{if(typeof c.imageEnabled!=='boolean')c.imageEnabled=false;});
      localStorage.setItem('altcards-v1',JSON.stringify(S));
    } else {
      S = {decks:[{id:'d1',name:'Hiszpański',lang:'es'}],cards:[],log:{},settings:{...defaults},daily:{},ratings:{}};
      localStorage.setItem('altcards-v1',JSON.stringify(S));
      this.queueUpload();
    }
  },
  queueUpload(){if(IS_DEV)return;if(!this.user)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.upload(),800)},
  async upload(){if(IS_DEV||!this.user||!S)return;try{await this.client.from('app_states').upsert({user_id:this.user.id,state:S,updated_at:new Date().toISOString()})}catch(e){}},
  async logXp(amount){
    if(IS_DEV||!this.user||amount<=0)return;
    try{await this.client.from('xp_logs').insert({user_id:this.user.id,amount:amount})}catch(e){}
  },
  async checkBonuses(){
    if(IS_DEV||!this.user)return;
    const key = 'altcards-bonus-'+dk(new Date());
    if(localStorage.getItem(key)) return;
    localStorage.setItem(key,'1');
    const yest = new Date(); yest.setDate(yest.getDate()-1);
    const yd = dk(yest);
    try {
      const {data} = await this.client.rpc('get_leaderboard',{p_start:yd, p_end:yd});
      if(!data) return;
      const idx = data.findIndex(d=>d.user_id===this.user.id);
      if(idx>=0 && idx<3){
        const bonus = idx===0?100:idx===1?50:25;
        S.settings.xp = (S.settings.xp||0) + bonus;
        await this.logXp(bonus);
        save();
        setTimeout(()=>{
          if($('#md')) $('#md').remove();
          const m = document.createElement('div'); m.id = 'md';
          m.innerHTML = `<div class="mb" style="text-align:center">

            <h3>Gratulacje!</h3>
            <p class="mu" style="margin-bottom:20px">Zająłeś <b>${idx + 1}. miejsce</b> w wczorajszym rankingu!</p>
            <p style="font-size:24px;font-weight:800;color:var(--ac)">+${bonus} XP</p>
            <button class="p" style="margin-top:20px" onclick="document.getElementById('md').remove()">Super!</button>
          </div>`;
          document.body.appendChild(m);
        }, 1500);
      }
    } catch(e){}
  },
  async setNickname(nick){
    const {error} = await this.client.from('profiles').insert({id:this.user.id, nickname:nick});
    if(error) return error.message;
    this.profile = {nickname:nick};
    return null;
  },
  async shareDeck(deck){
    const cards = S.cards.filter(c=>c.deck===deck.id).map(c=>({front:c.front,back:c.back,contextSentence:c.contextSentence,imageUrl:c.imageUrl}));
    if(!cards.length) return "Pusta talia.";
    const {data, error} = await this.client.from('shared_decks').insert({author_id:this.user.id,name:deck.name,lang:deck.lang,cards:cards}).select();
    if(error) return "Błąd: " + error.message;
    if(!data || data.length === 0) return "Insert się nie powiódł. Sprawdź politykę RLS.";
    deck.sharedId = data[0].id;
    return null;
  },
  async unshareDeck(sharedId){
    const {error} = await this.client.from('shared_decks').delete().eq('id', sharedId);
    if(error) return "Błąd: " + error.message;
    await this.client.from('deck_copies').delete().eq('deck_id', sharedId);
    return null;
  },
  async copyDeck(sharedId,name,lang,cards){
    const {data:exist} = await this.client.from('deck_copies').select('id').eq('user_id',this.user.id).eq('deck_id',sharedId).maybeSingle();
    if(exist) return t('library.alreadyCopied');
    const newDeckId = uid();
    S.decks.push({id:newDeckId,name:name,lang:lang,isCopied:true,copiedFrom:sharedId});
    cards.forEach(c=>S.cards.push({id:uid(),deck:newDeckId,front:c.front,back:c.back,imageUrl:c.imageUrl,contextSentence:c.contextSentence,imageEnabled:false,ease:2.5,int:0,reps:0,lapses:0,due:0}));
    save();
    await this.client.from('deck_copies').insert({user_id:this.user.id,deck_id:sharedId});
    const {data:sd} = await this.client.from('shared_decks').select('author_id').eq('id',sharedId).single();
    if(sd && sd.author_id !== this.user.id){
      try{await this.client.rpc('add_xp',{target_user_id:sd.author_id, xp_amount:50})}catch(e){}
    }
    return null;
  },
  async signOut(){
    if(IS_DEV){if(confirm('Wyczyścić?')){localStorage.removeItem('altcards-v1');location.reload()}return}
    if(this.client)await this.client.auth.signOut();
    this.user=null; this.profile=null; S=null;
    localStorage.removeItem('altcards-v1');
    showLogin(); toast(t('settings.loggedOut'));
  },
  async executeDeleteAccount(){
    const btn = $('#delbtn');
    if(btn){btn.textContent='⏳';btn.disabled=true}
    try {
      const {error} = await this.client.rpc('delete_user_account');
      if(error){toast(error.message);if(btn){btn.textContent=t('settings.deleteConfirmBtn');btn.disabled=false}return}
      await this.client.auth.signOut();
      this.user=null; this.profile=null; S=null;
      localStorage.removeItem('altcards-v1');
      $('#md')?.remove(); showLogin(); toast(t('settings.deleted'));
    } catch(e){toast(e.message);if(btn){btn.textContent=t('settings.deleteConfirmBtn');btn.disabled=false}}
  }
};

    }

    }
    v.innerHTML = `<div class="progress-bar-container"><div class="track"><div class="pet" style="left:${progress}%">${petEmoji}</div></div><span class="house">🏠</span></div>
      <div class="prog" style="display:flex;justify-content:space-between;align-items:center">
        <span>${t('sess.remaining')} ${sess.q.length}</span>
        <button class="s" style="padding:6px 12px;font-size:13px" onclick="sess=null;render()">${t('sess.end')}</button>
      </div>
      <div class="card" style="margin-top:12px;position:relative" onclick="if(!flip){flip=true;render()}">${prompt}${flip?flipContent:`<div class="hint" style="margin-top:24px">${t('sess.discover')}</div>`}</div>

      ${flip?`<div class="g"><button style="background:#ef4444" onclick="ans(0)">${t('sess.again')}</button><button style="background:#f59e0b" onclick="ans(1)">${t('sess.hard')}</button><button style="background:#10b981" onclick="ans(2)">${t('sess.good')}</button><button style="background:#3b82f6" onclick="ans(3)">${t('sess.easy')}</button></div><p class="hint" style="text-align:center;margin-top:12px;opacity:0.7">${t('sess.keysHint')}</p>`:''}`;
    if(flip && imgRev) loadCardImage(c);

  }
  const todayCount = S.daily[dk(new Date())]||0;
  const remaining = Math.max(0, S.settings.newLimit - todayCount);
  const allDue = due(sd);

  v.innerHTML = `<h2>${t('study.title')}</h2>

      <div><div class="n">${rv}</div><span class="mu">${t('study.due')} <span class="info-icon" onclick="showInfo('${t('study.due')}', t('info.due'))">i</span></span></div>

      <div><div class="n">${todayCount}</div><span class="mu">${t('study.today')} <span class="info-icon" onclick="showInfo('${t('study.today')}', t('info.today'))">i</span></span></div>

function start(){
  const remaining = Math.max(0, S.settings.newLimit - (S.daily[dk(new Date())]||0));
  const allDue = due(sd);
  const review = allDue.filter(c=>!isNew(c));
  const newC = allDue.filter(c=>isNew(c));
  const queue = [...review,...newC].slice(0,remaining).map(c=>c.id);
  sess = {q:queue,total:queue.length}; flip=false; imgRev=false; undoStack=[]; render();
}
function shuffleNewInDeck(){
  const pool = S.cards.map((c,i)=>({c,i})).filter(x=>(!sd||x.c.deck===sd)&&isNew(x.c));
  if(pool.length<2){toast(t('study.tooFewNew'));return}
  const sh=pool.map(x=>x.c);
  for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]]}
  pool.forEach((x,k)=>{S.cards[x.i]=sh[k]});
  save(); toast(t('study.shuffled').replace('{n}',Math.min(S.settings.newLimit,pool.length)));
  render();
}
function say(id){
  const c=S.cards.find(x=>x.id==id),d=S.decks.find(x=>x.id==c.deck);
  try{const u=new SpeechSynthesisUtterance(c.front);u.lang=(L[d?.lang]||L.es).tts;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function grade(c,g){
  if(g===0){c.lapses++;c.ease=Math.max(1.3,c.ease-.2);c.int=0;c.due=Date.now();return}
  if(g===1){c.ease=Math.max(1.3,c.ease-.15);c.int=Math.max(1,Math.round((c.int||1)*1.2))}
  if(g===2)c.int=c.int<1?1:c.int<2?3:Math.round(c.int*c.ease);
  if(g===3){c.ease+=.15;c.int=c.int<1?4:Math.round(c.int*c.ease*1.3)}
  c.reps++; c.due = sod()+c.int*864e5;
}
function ans(g){
  const id=sess.q[0], c=S.cards.find(x=>x.id===id), k=dk(new Date());
  undoStack.push({card:JSON.parse(JSON.stringify(c)),queue:[...sess.q],flip,daily:S.daily[k]||0,xp:S.settings.xp||0,ratings:JSON.parse(JSON.stringify(S.ratings)),log:JSON.parse(JSON.stringify(S.log))});
  if(undoStack.length>50) undoStack.shift();
  sess.q.shift();
  grade(c,g);
  S.log[k]=(S.log[k]||0)+1;
  if(!S.ratings[k])S.ratings[k]=[0,0,0,0];
  S.ratings[k][g]=(S.ratings[k][g]||0)+1;
  if(!S.daily[k])S.daily[k]=0;
  if(g>0){
    S.daily[k]++;
    const xpGain = g===1?5:g===2?10:15;
    S.settings.xp = (S.settings.xp||0) + xpGain;
    Sync.logXp(xpGain);
  } else {
    sess.q.splice(Math.min(3,sess.q.length),0,id);
  }
  const prevLvl = getLevelInfo(undoStack[undoStack.length-1].xp||0).level;
  save(); flip=false; imgRev=false;
  const newLvl = getLevelInfo(S.settings.xp||0).level;
  render();
  if(newLvl > prevLvl){
    setTimeout(()=>{
      toast(`🎉 LEVEL UP! ${newLvl} - ${getRank(newLvl)}`);
      const el = document.getElementById('lvl-display');
      if(el) el.classList.add('level-up-anim');
    },100);
  }
}
function undoAnswer(){
  if(!undoStack.length){toast(t('sess.noUndo'));return}
  const st = undoStack.pop();
  const c = S.cards.find(x=>x.id===st.card.id);
  if(c) Object.assign(c, st.card);
  sess.q=[...st.queue]; flip=st.flip;
  const k = dk(new Date());
  S.daily[k]=st.daily; S.settings.xp=st.xp; S.ratings=st.ratings; S.log=st.log;
  save(); render(); toast(t('sess.undone'));
}
async function loadCardImage(c){
  const host = $('#imghost'); if(!host) return;
  if(c.imageUrl){host.innerHTML=`<img class="review-image" alt="" src="${esc(c.imageUrl)}"><div class="mu">${t('sess.imgCredit')}</div>`;return}
  host.textContent = t('sess.imgSearch');
  const search = async (q)=>{
    const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url|mime&iiurlwidth=900&format=json&origin=*`;
    const r = await fetch(url); if(!r.ok) return [];
    const j = await r.json();
    return Object.values(j.query?.pages||{}).filter(p=>p.imageinfo?.[0]?.thumburl&&/^image\/(jpeg|png|webp)/.test(p.imageinfo[0].mime||''));
  };
  try{
    let pages = await search(c.front);
    if(!pages.length) pages = await search(c.back);
    if(!pages.length) pages = await search(c.front.split(' ')[0]);
    if(!pages.length){host.textContent=t('sess.imgNotFound');return}
    const best = pages[0].imageinfo[0].thumburl;
    c.imageUrl = best; save();
    host.innerHTML = `<img class="review-image" alt="" src="${esc(best)}"><div class="mu">${t('sess.imgCredit')}</div>`;
  }catch(e){host.textContent=t('sess.imgError')}
}

async function shareDeck(id){
  const deck = S.decks.find(x=>x.id===id);
  if(!deck) return;
  if(deck.isCopied) { toast(t('cards.copyBlocked')); return; }
  if(deck.sharedId) { toast('Ta talia jest już udostępniona.'); return; }
  if(!confirm(`Udostępnić "${deck.name}" publicznie? Inni będą mogli skopiować.`)) return;
  toast('Udostępniam...');
  const err = await Sync.shareDeck(deck);
  if(err) toast(err);
  else {
    save(); render();
    toast(t('cards.shared'));
    setTimeout(()=>{ if(tab==='cards'){ tab='library'; render(); } }, 1000);
  }
}
async function unshareDeck(id){
  const deck = S.decks.find(x=>x.id===id);
  if(!deck || !deck.sharedId) return;
  if(!confirm('Wycofać udostępnianie tej talii? Inni nie będą mogli jej już skopiować.')) return;
  const err = await Sync.unshareDeck(deck.sharedId);
  if(err) toast(err);
  else {
    deck.sharedId = null;
    save(); render();
    toast(t('cards.unshared'));

function parseCSV(t){
  t = t.replace(/^\uFEFF/,'');
  const first = t.split('\n')[0], sep = [';','\t',','].map(s=>[s,first.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==sep){r.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
async function importCSV(){
  const fl = $('#cf').files[0]; if(!fl){toast(t('cards.selectFile'));return}
  const cl = s=>(s||'').replace(/<br\s*\/?>/gi,'; ').replace(/<[^>]+>/g,'').trim();
  const rows = parseCSV(await fl.text());
  const a = Math.max(1,+$('#c1').value||1)-1, b = Math.max(1,+$('#c2').value||2)-1;
  const d = $('#idk').value;
  if(rows.length && /^(front|back|przód|tył|question|answer)/i.test(cl(rows[0][a]))) rows.shift();
  const have = new Set(S.cards.filter(c=>c.deck==d).map(c=>c.front.toLowerCase()));
  let n=0;
  rows.forEach(r=>{const x=cl(r[a]),y=cl(r[b]);if(x&&y&&!have.has(x.toLowerCase())){have.add(x.toLowerCase());S.cards.push({id:uid(),deck:d,front:x,back:y,imageEnabled:false,ease:2.5,int:0,reps:0,lapses:0,due:0});n++}});
  save(); toast(t('cards.imported').replace('{n}',n)); renderCards(); dlist();
}

function plink(){

async function suggest(){
  const f = $('#fr').value.trim(), box = $('#sg');
  if(!f) return;
  box.innerHTML = `<span class="mu">${t('add.sg.search')}</span>`;
  try{
    const nb = window.webkit && webkit.messageHandlers && webkit.messageHandlers.tr;
    const sm = nb ? null : (window.claude && await claude.use('sample'));
    if(!nb && !sm){box.innerHTML = `<span class="mu">${t('add.sg.unavailable')}</span>`;return}
    const d = S.decks.find(x=>x.id==$('#dk').value), ln = L[d?.lang]||L.es;
    const r = nb ? await nb.postMessage({q:f,lang:d.lang}) : await sm.json(`Słownik polsko-${ln.name.pl}. Hasło: „${f}”. Podaj do 4 tłumaczeń. JSON array stringów.`);
    const arr = (Array.isArray(r)?r:[]).slice(0,4);
    box.innerHTML = '';
    arr.forEach(tn=>{const b=document.createElement('button');b.textContent=String(tn);b.onclick=()=>{const k=$('#bk');k.value=k.value?k.value+', '+tn:tn};box.appendChild(b)});
    if(!arr.length) box.innerHTML = `<span class="mu">${t('add.sg.noResults')}</span>`;
  }catch(e){box.innerHTML = `<span class="mu">${t('add.sg.error')}</span>`}

// ============ STATS ============
function vStats(v){
  const C = S.cards, tk = dk(new Date());
  const mast = C.filter(c=>c.int>=21).length, nw = C.filter(isNew).length, lr = C.length-mast-nw;
  const today = S.daily[tk]||0;
  const reviewedEver = C.filter(c=>c.reps>0).length;
  let streak=0; const d=new Date();
  if(!S.log[dk(d)]) d.setDate(d.getDate()-1);
  while(S.log[dk(d)]){streak++;d.setDate(d.getDate()-1)}
  const aks = Object.keys(S.log).filter(k=>S.log[k]>0).sort();
  let longest=0,cur=0,prev=null;
  aks.forEach(k=>{if(prev){const diff=Math.round((new Date(k+'T00:00:00')-new Date(prev+'T00:00:00'))/864e5);cur=diff===1?cur+1:1}else cur=1;if(cur>longest)longest=cur;prev=k});
  const R = S.ratings||{};
  let tA=0,tH=0,tG=0,tE=0;
  Object.values(R).forEach(a=>{tA+=a[0]||0;tH+=a[1]||0;tG+=a[2]||0;tE+=a[3]||0});
  const total = tA+tH+tG+tE;
  const ret = total?Math.round((tG+tE)/total*100)+'%':'—';
  const chart = [...Array(30)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-(29-i));const a=R[dk(x)]||[0,0,0,0];return a[0]+a[1]+a[2]+a[3]});
  const mx = Math.max(1,...chart);
  const perDeck = S.decks.map(dk=>{const dc=C.filter(c=>c.deck===dk.id);return{name:dk.name,total:dc.length,new:dc.filter(isNew).length,mastered:dc.filter(c=>c.int>=21).length}});
  const gb = (label,n,col)=>{const h=total?Math.round(n/Math.max(1,total)*80):0;return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end"><div style="font-size:12px;color:var(--mu);margin-bottom:4px">${n}</div><div style="width:70%;background:${col};border-radius:4px 4px 0 0;min-height:2px;height:${h}px"></div><div style="font-size:11px;color:var(--mu);margin-top:4px">${label}</div></div>`};
  v.innerHTML = `<h2>${t('stats.title')}</h2>
    <h3>${t('stats.now')}</h3>
    <div class="st">
      <div class="c"><div class="n">${C.length}</div><span class="mu">${t('stats.all')}</span></div>
      <div class="c"><div class="n">${mast}</div><span class="mu">${t('stats.mastered')} <span class="info-icon" onclick="showInfo('${t('stats.mastered')}', t('info.mastered'))">i</span></span></div>
      <div class="c"><div class="n">${lr}</div><span class="mu">${t('stats.learning')} <span class="info-icon" onclick="showInfo('${t('stats.learning')}', t('info.learning'))">i</span></span></div>
      <div class="c"><div class="n">${nw}</div><span class="mu">${t('stats.new')} <span class="info-icon" onclick="showInfo('${t('stats.new')}', t('info.new'))">i</span></span></div>
      <div class="c"><div class="n">${due('').length}</div><span class="mu">${t('stats.dueNow')} <span class="info-icon" onclick="showInfo('${t('stats.dueNow')}', t('info.due'))">i</span></span></div>
      <div class="c"><div class="n">${today}</div><span class="mu">${t('stats.today')} <span class="info-icon" onclick="showInfo('${t('stats.today')}', t('info.today'))">i</span></span></div>
    </div>
    <h3>${t('stats.total')}</h3>
    <div class="st">
      <div class="c"><div class="n">${total}</div><span class="mu">${t('stats.allAnswers')}</span></div>
      <div class="c"><div class="n">${reviewedEver}</div><span class="mu">${t('stats.reviewedCards')}</span></div>
      <div class="c"><div class="n">${ret}</div><span class="mu">${t('stats.retention')} <span class="info-icon" onclick="showInfo('${t('stats.retention')}', t('info.retention'))">i</span></span></div>
      <div class="c"><div class="n">${aks.length}</div><span class="mu">${t('stats.daysTotal')}</span></div>
      <div class="c"><div class="n">${streak}🔥</div><span class="mu">${t('stats.streak')} <span class="info-icon" onclick="showInfo('${t('stats.streak')}', t('info.streak'))">i</span></span></div>
      <div class="c"><div class="n">${longest}</div><span class="mu">${t('stats.longestStreak')} <span class="info-icon" onclick="showInfo('${t('stats.longestStreak')}', t('info.longest'))">i</span></span></div>
    </div>
    <div class="c"><b>${t('stats.byRating')}</b><div style="display:flex;gap:8px;height:110px;margin-top:10px">${gb(t('stats.again'),tA,'#ef4444')}${gb(t('stats.hard'),tH,'#f59e0b')}${gb(t('stats.good'),tG,'#10b981')}${gb(t('stats.easy'),tE,'#3b82f6')}</div></div>
    <div class="c"><b>${t('stats.last30')}</b> <span class="mu">(max: ${mx})</span><div class="bars" style="margin-top:10px;height:70px;gap:2px">${chart.map(n=>`<div><i style="height:${Math.round(n/mx*50)}px"></i></div>`).join('')}</div></div>
    <div class="c"><h3>🏆 ${t('stats.leaderboard')}</h3>
      <div class="tabs"><button class="${lbTab==='day'?'on':''}" onclick="lbTab='day';render()">${t('stats.day')}</button><button class="${lbTab==='month'?'on':''}" onclick="lbTab='month';render()">${t('stats.month')}</button></div>
      <div id="lb-list"><p class="mu">${t('library.loading')}</p></div>
    </div>
    <h3>${t('stats.perDeck')}</h3>
    ${perDeck.map(d=>`<div class="it"><div><b>${esc(d.name)}</b><br><span class="mu">${t('stats.deckLine').replace('{total}',d.total).replace('{new}',d.new).replace('{mastered}',d.mastered)}</span></div></div>`).join('')||`<p class="mu">${t('cards.noCards')}</p>`}
    <h3>${t('stats.backup')}</h3><p class="mu">${t('stats.backupInfo')}</p>
    <div class="row"><button class="s" onclick="bkp()">${t('stats.copyBackup')}</button><button class="s" onclick="rst()">${t('stats.pasteBackup')}</button></div>`;
  
  const todayD = new Date();
  const start = lbTab==='day' ? dk(todayD) : todayD.getFullYear()+'-'+pad(todayD.getMonth()+1)+'-01';
  const end = dk(todayD);
  Sync.client.rpc('get_leaderboard',{p_start:start,p_end:end}).then(({data,error})=>{
    if(error || !data || !data.length){$('#lb-list').innerHTML=`<p class="mu">${t('stats.noLbData')}</p>`;return}
    $('#lb-list').innerHTML = data.map((u,i)=>`<div class="it" style="padding:8px 0"><div style="font-weight:bold;font-size:16px;width:36px">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</div><div>${esc(u.nickname||'?')}</div><div style="text-align:right;font-weight:bold;color:var(--ac)">${u.total_xp} XP</div></div>`).join('');
  });
}

function rst(){modal(t('stats.pasteTitle'),[{ph:t('stats.pastePlaceholder')}],v=>{try{const o=JSON.parse(v[0]);if(!o.decks||!o.cards)throw 0;S=o;save();render();toast(t('stats.restored'))}catch(e){toast(t('stats.invalidBackup'))}})}

// ============ KEYBOARD ============
document.addEventListener('keydown',e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable) return;
  if($('#md')||$('#login')||($('#fbx-overlay') && !$('#fbx-overlay').hidden)) return;
  if(tab!=='study'||!sess||!sess.q.length) return;
  const key = e.key.toLowerCase();
  const c = S.cards.find(x=>x.id==sess.q[0]);
  if(!c) return;
  if(key==='m'){say(c.id);e.preventDefault();return}
  if(!flip){
    if(key===' '||e.code==='Space'){e.preventDefault();flip=true;render();return}
    if(key==='o'){e.preventDefault();flip=true;revealImg(c.id);return}
    if(key==='z'){e.preventDefault();undoAnswer();return}
    return;
  }
  if(key==='1'){e.preventDefault();ans(0)}
  else if(key==='2'){e.preventDefault();ans(1)}
  else if(key==='3'){e.preventDefault();ans(2)}
  else if(key==='4'){e.preventDefault();ans(3)}
  else if(key==='z'){e.preventDefault();undoAnswer()}
  else if(key==='o'){e.preventDefault();revealImg(c.id)}
});

Sync.init();
