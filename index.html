<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fiszki">
<title>Fiszki</title>
<style>
:root{--bg:#f5f5f7;--sf:#fff;--tx:#1c1c1e;--mu:#6e6e73;--ac:#4f46e5;--bd:#d8d8de;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--sf:#1c1c1e;--tx:#f2f2f7;--mu:#98989f;--ac:#818cf8;--bd:#3a3a3c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--sf:#1c1c1e;--tx:#f2f2f7;--mu:#98989f;--ac:#818cf8;--bd:#3a3a3c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",sans-serif;-webkit-tap-highlight-color:transparent}
main{flex:1;overflow-y:auto;padding:16px;max-width:560px;width:100%;margin:0 auto}
nav{display:flex;border-top:1px solid var(--bd);background:var(--sf)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 0 8px;font-size:12px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--ac)}
input,select,textarea{width:100%;padding:12px;margin:0 0 10px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);font:inherit}
textarea{min-height:70px;resize:vertical}
button{font:inherit;cursor:pointer}
.p{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;margin:4px 0 10px}
.s{padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx)}
.c{background:var(--sf);border-radius:16px;padding:18px;margin-bottom:12px}
.card{background:var(--sf);border-radius:20px;padding:28px 18px;min-height:240px;text-align:center;display:flex;flex-direction:column;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.f{font-size:28px;font-weight:600;word-break:break-word}
.b{font-size:22px;color:var(--ac);word-break:break-word}
.sentence{font-size:24px;line-height:1.55;word-break:break-word}.blank{font-weight:700;letter-spacing:2px;border-bottom:2px solid var(--ac)}
.hint,.prog,.mu{color:var(--mu);font-size:14px}
hr{width:60%;border:0;border-top:1px solid var(--bd);margin:18px auto}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.g button{padding:14px 0;border:0;border-radius:12px;color:#fff;font-weight:600;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
.it{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.it div{flex:1;min-width:0;overflow-wrap:anywhere}
.it button{border:0;background:none;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.chips button{padding:8px 12px;border:1px solid var(--ac);border-radius:20px;background:none;color:var(--ac)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.bars i{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.n{font-size:30px;font-weight:700}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#333;color:#fff;padding:8px 16px;border-radius:20px;display:none}
a{color:var(--ac)}
h3{margin:18px 0 8px}
body.reviewing main{max-width:none;width:100%;padding:clamp(16px,4vw,42px);display:flex;flex-direction:column}
body.reviewing #v{width:100%;max-width:900px;margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:center}
body.reviewing .card{flex:1;min-height:50vh;font-size:1.15em;cursor:pointer}
body.reviewing .card .f{font-size:clamp(30px,5vw,48px)}
body.reviewing .card .b{font-size:clamp(24px,4vw,36px)}
.review-image{display:block;max-width:100%;max-height:32vh;object-fit:contain;margin:18px auto 0;border-radius:14px}
body.reviewing nav{display:none}
body.reviewing #t{bottom:20px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.mb{background:var(--sf);border-radius:16px;padding:18px;width:100%;max-width:420px}
.mb textarea{min-height:50px}.mb h3{margin-top:0}
</style></head><body>
<main id="v"></main>
<nav>
<button data-t="study"><b>🧠</b>Nauka</button>
<button data-t="add"><b>＋</b>Dodaj</button>
<button data-t="cards"><b>🗂</b>Karty</button>
<button data-t="stats"><b>📊</b>Postępy</button>
</nav>
<div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#4f46e5';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.font='bold 100px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('Ñ',90,95);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL();document.head.appendChild(l)})();
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L={es:['hiszpański','espl','es-ES'],en:['angielski','enpl','en-GB'],de:['niemiecki','depl','de-DE'],fr:['francuski','frpl','fr-FR'],it:['włoski','itpl','it-IT']};
// Wklej wartości z Supabase: Settings → API. Klucz anon jest przeznaczony do aplikacji klienckich.
const SUPABASE_URL='https://icwmcoxscwpswrhmfiht.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_saVIwdtGphXww4eraJIr-w_0qy5ShrO';
const createSupabaseClient=()=>{try{return SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null}catch(e){console.error('Nieprawidłowa konfiguracja Supabase',e);return null}};
let Sync=null;
let S=null;
try{S=JSON.parse(localStorage.getItem('fiszki-v1'))}catch(e){}
if(!S)S={decks:[{id:'d1',name:'Hiszpański',lang:'es'}],cards:[],log:{}};
const save=()=>{S.updatedAt=Date.now();try{localStorage.setItem('fiszki-v1',JSON.stringify(S))}catch(e){};Sync?.queueUpload()};
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const sod=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const toast=m=>{const t=$('#t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1600)};
const deckOpts=sel=>S.decks.map(d=>`<option value="${d.id}"${d.id==sel?' selected':''}>${esc(d.name)}</option>`).join('');
const isNew=c=>!(c.reps>0||c.lapses>0);
const due=d=>S.cards.filter(c=>(!d||c.deck==d)&&c.due<=Date.now());
let tab='study',sess=null,flip=false,imageRevealed=false,sd='',lastDeck='',undoState=null;
const defaults={newLimit:20};
S.settings={...defaults,...(S.settings||{})};
S.daily={...(S.daily||{})};
S.cards.forEach(c=>{if(typeof c.imageEnabled!=='boolean')c.imageEnabled=false;});
save();
Sync={
  client:createSupabaseClient(),
  user:null,timer:0,
  async init(){if(!this.client)return;const {data:{session}}=await this.client.auth.getSession();this.user=session?.user||null;if(this.user)await this.download();render()},
  async download(){const {data}=await this.client.from('app_states').select('state').eq('user_id',this.user.id).maybeSingle();if(data?.state&&(+data.state.updatedAt||0)>(+S.updatedAt||0)){S=data.state;localStorage.setItem('fiszki-v1',JSON.stringify(S));render()}},
  queueUpload(){if(!this.client||!this.user)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.upload(),800)},
  async upload(){if(!this.client||!this.user)return;await this.client.from('app_states').upsert({user_id:this.user.id,state:S,updated_at:new Date().toISOString()})},
  async signIn(email,password,signUp){if(!this.client){toast('Uzupełnij konfigurację Supabase w index.html');return}const r=signUp?await this.client.auth.signUp({email,password}):await this.client.auth.signInWithPassword({email,password});if(r.error){toast(r.error.message);return}this.user=r.data.user;await this.download();render();toast(signUp?'Sprawdź e-mail, aby potwierdzić konto':'Zalogowano i zsynchronizowano')},
  async signOut(){if(this.client)await this.client.auth.signOut();this.user=null;render();toast('Wylogowano')}
};


function render(){
  document.body.classList.toggle('reviewing',tab==='study'&&!!sess);
  ({study:vStudy,add:vAdd,cards:vCards,stats:vStats,settings:vSettings})[tab]($('#v'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});

function vStudy(v){
  if(sess){
    if(!sess.q.length){v.innerHTML=`<div class="c" style="text-align:center"><h2>Gotowe! 🎉</h2><p class="mu">Sesja ukończona. Zajrzyj do zakładki Postępy.</p><button class="p" onclick="sess=null;render()">Wróć</button></div>`;return}
    const c=S.cards.find(x=>x.id==sess.q[0]);
    const prompt=c.contextSentence?`<div class="sentence">${esc(c.contextSentence).replace(/\{\{.*?\}\}/,'<span class="blank">_____</span>')}</div>`:`<div class="f">${esc(c.front)}</div>`;
    v.innerHTML=`<div class="prog">Pozostało: ${sess.q.length} <button class="s" style="float:right" onclick="sess=null;render()">Zakończ</button></div><div class="card" style="margin-top:12px" onclick="flip=true;render()">${prompt}${flip?`<hr><div class="f">${esc(c.front)}</div><div class="b">${esc(c.back)}</div>${c.contextSentence?'<p class="mu">'+esc(c.contextSentence).replace(/\{\{(.*?)\}\}/,'<b>$1</b>')+'</p>':''}${imageRevealed?'<div id="imghost" class="mu">Szukam obrazu…</div>':'<button class="s" style="margin-top:18px" onclick="event.stopPropagation();revealImage(&quot;'+c.id+'&quot;)">🖼 Pokaż obraz</button>'}`:'<div class="hint" style="margin-top:20px">Dotknij, aby odkryć</div>'}</div>
    <div class="row" style="margin-top:10px"><button class="s" onclick="say('${c.id}')">🔊 Wymowa</button><button class="s" onclick="undoAnswer()">↶ Cofnij odpowiedź</button></div>`+
    (flip?`<div class="g"><button style="background:#e5484d" onclick="ans(0)">Znowu</button><button style="background:#f08c00" onclick="ans(1)">Trudne</button><button style="background:#30a46c" onclick="ans(2)">Dobrze</button><button style="background:#3b82f6" onclick="ans(3)">Łatwe</button></div>`:'');
    if(flip&&imageRevealed)loadCardImage(c);
    return;
  }
  const a=due(sd),nw=a.filter(isNew).length,rv=a.length-nw;
  v.innerHTML=`<h2>Nauka</h2><select onchange="sd=this.value;render()"><option value="">Wszystkie decki</option>${deckOpts(sd)}</select>
  <div class="row"><button class="s" onclick="tab='settings';render()">⚙️ Ustawienia</button></div>
  <div class="c"><div class="st"><div><div class="n">${rv}</div><span class="mu">do powtórki</span></div><div><div class="n">${Math.min(nw,S.settings.newLimit)}</div><span class="mu">nowe (limit 20)</span></div><div><div class="n">${(S.daily[dk(new Date())]||[]).length}</div><span class="mu">fiszek dziś</span></div></div>
  <button class="p" ${a.length?'':'disabled style="opacity:.4"'} onclick="start()">Zacznij naukę</button>
  ${S.cards.length?'':'<p class="mu">Nie masz jeszcze fiszek – dodaj je w zakładce „Dodaj”.</p>'}</div>`;
  const sel=v.querySelector('select');sel.value=sd;
}
function start(){
  const a=due(sd),rev=a.filter(c=>!isNew(c)),nw=a.filter(isNew).slice(0,S.settings.newLimit);
  sess={q:[...rev,...nw].map(c=>c.id)};flip=false;imageRevealed=false;render();
}
function say(id){
  const c=S.cards.find(x=>x.id==id),d=S.decks.find(x=>x.id==c.deck);
  try{const u=new SpeechSynthesisUtterance(c.front);u.lang=(L[d&&d.lang]||L.es)[2];speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function grade(c,g){
  if(g==0){c.lapses++;c.ease=Math.max(1.3,c.ease-.2);c.int=0;c.due=Date.now();return}
  if(g==1){c.ease=Math.max(1.3,c.ease-.15);c.int=Math.max(1,Math.round((c.int||1)*1.2))}
  if(g==2)c.int=c.int<1?1:c.int<2?3:Math.round(c.int*c.ease);
  if(g==3){c.ease+=.15;c.int=c.int<1?4:Math.round(c.int*c.ease*1.3)}
  c.reps++;c.due=sod()+c.int*864e5;
}
function ans(g){
  const id=sess.q[0],c=S.cards.find(x=>x.id==id);
  undoState={cardId:id,card:JSON.parse(JSON.stringify(c)),queue:[...sess.q],flip,log:JSON.parse(JSON.stringify(S.log)),daily:JSON.parse(JSON.stringify(S.daily))};
  sess.q.shift();
  grade(c,g);
  const k=dk(new Date());S.log[k]=(S.log[k]||0)+1;
  if(!S.daily[k])S.daily[k]=[];
  if(!S.daily[k].includes(id))S.daily[k].push(id);
  if(g==0)sess.q.splice(Math.min(3,sess.q.length),0,id);
  save();flip=false;imageRevealed=false;render();
}

let sgTimer=0;

function vSettings(v){
  const account=Sync?.user?`<p class="mu">Zalogowano: ${esc(Sync.user.email||'konto')}</p><button class="s" onclick="Sync.signOut()">Wyloguj</button>`:`<input id="semail" type="email" placeholder="E-mail"><input id="spass" type="password" minlength="6" placeholder="Hasło (min. 6 znaków)"><div class="row"><button class="s" onclick="signIn(false)">Zaloguj</button><button class="s" onclick="signIn(true)">Załóż konto</button></div>`;
  v.innerHTML=`<h2>Ustawienia</h2><div class="c"><h3>Synchronizacja</h3>${Sync?.client?account:'<p class="mu">Synchronizacja nie jest skonfigurowana.</p>'}</div><div class="c"><label for="nlmt"><b>Limit nowych fiszek na sesję</b></label>
  <p class="mu">Maksymalna liczba nowych kart dodawanych do jednej sesji nauki.</p>
  <input id="nlmt" type="number" min="1" max="500" value="${S.settings.newLimit}">
  <button class="p" onclick="saveSettings()">Zapisz ustawienia</button></div>
  <button class="s" onclick="tab='study';render()">← Wróć do nauki</button>`;
}
function signIn(signUp){const e=$('#semail').value.trim(),p=$('#spass').value;if(!e||p.length<6){toast('Podaj e-mail i hasło (min. 6 znaków)');return}Sync.signIn(e,p,signUp)}
function saveSettings(){
  const n=Math.max(1,Math.min(500,parseInt($('#nlmt').value,10)||20));
  S.settings.newLimit=n;save();toast('Zapisano ustawienia');tab='study';render();
}
function undoAnswer(){
  if(!undoState){toast('Nie ma odpowiedzi do cofnięcia');return}
  const c=S.cards.find(x=>x.id===undoState.cardId);
  if(c)Object.assign(c,undoState.card);
  sess.q=[...undoState.queue];flip=undoState.flip;S.log=undoState.log;S.daily=undoState.daily;
  undoState=null;save();render();toast('Cofnięto ostatnią odpowiedź');
}
async function loadCardImage(c){
  const host=$('#imghost');if(!host)return;
  if(c.imageUrl){host.innerHTML=`<img class="review-image" alt="${esc(c.front)}" src="${esc(c.imageUrl)}"><div class="mu">Obraz poglądowy · Wikimedia Commons</div>`;return}
  host.textContent='Szukam obrazu…';
  try{
    const q=encodeURIComponent(c.front);
    const url=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${q}&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url|mime&iiurlwidth=900&format=json&origin=*`;
    const r=await fetch(url);if(!r.ok)throw Error('network');
    const j=await r.json();
    const pages=Object.values(j.query?.pages||{}).filter(p=>p.imageinfo?.[0]?.thumburl&&/^image\/(jpeg|png|webp)/.test(p.imageinfo[0].mime||''));
    if(!pages.length){host.textContent='Nie znaleziono pasującego obrazu.';return}
    const best=pages[0].imageinfo[0].thumburl;c.imageUrl=best;save();
    host.innerHTML=`<img class="review-image" alt="${esc(c.front)}" src="${esc(best)}"><div class="mu">Obraz poglądowy · Wikimedia Commons</div>`;
  }catch(e){host.textContent='Obraz niedostępny — sprawdź połączenie z internetem.'}
}
function revealImage(id){
  const c=S.cards.find(x=>x.id===id);if(!c)return;
  c.imageEnabled=true;imageRevealed=true;save();render();
}

function vAdd(v){
  v.innerHTML=`<h2>Nowa fiszka</h2><select id="dk" onchange="lastDeck=this.value">${deckOpts(lastDeck||(S.decks[0]||{}).id)}</select>
  <textarea id="fr" placeholder="Przód (np. słowo)" onchange="suggest()" oninput="plink()"></textarea>
  <div class="row" style="margin-bottom:10px"><button class="s" onclick="suggest()">✨ Podpowiedz tłumaczenie</button><a class="s" id="pl" target="_blank" rel="noopener" style="text-decoration:none;text-align:center">Otwórz w PONS</a></div>
  <div id="sg" class="chips"></div>
  <textarea id="bk" placeholder="Tył (np. tłumaczenie)"></textarea>
  <button class="p" onclick="addCard()">Dodaj fiszkę</button>`;
  plink();
}
function plink(){
  const d=S.decks.find(x=>x.id==$('#dk').value),l=(L[d&&d.lang]||L.es)[1];
  $('#pl').href=`https://pl.pons.com/tłumaczenie?q=${encodeURIComponent($('#fr').value.trim())}&l=${l}`;
}
async function suggest(){
  const f=$('#fr').value.trim(),box=$('#sg');
  if(!f)return;
  const d=S.decks.find(x=>x.id==$('#dk').value),ln=L[d&&d.lang]||L.es;
  box.innerHTML='<span class="mu">Szukam…</span>';
  try{
    const nb=window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.tr;
    const sm=nb?null:(window.claude&&await claude.use('sample'));
    if(!nb&&!sm){box.innerHTML='<span class="mu">Podpowiedzi niedostępne w tym widoku – użyj przycisku PONS.</span>';return}
    const r=nb?await nb.postMessage({q:f,lang:d.lang}):await sm.json(`Działasz jak słownik polsko-${ln[0]}. Hasło: „${f}”. Jeśli hasło jest po polsku, podaj do 4 najczęstszych tłumaczeń na język: ${ln[0]}. W przeciwnym razie podaj do 4 najczęstszych polskich tłumaczeń. Przy rzeczownikach w języku obcym dodaj rodzajnik, jeśli istnieje. Odpowiedz wyłącznie tablicą JSON z krótkimi stringami, bez komentarzy.`);
    const arr=(Array.isArray(r)?r:[]).slice(0,4);
    box.innerHTML='';
    arr.forEach(t=>{const b=document.createElement('button');b.textContent=String(t);b.onclick=()=>{const k=$('#bk');k.value=k.value?k.value+', '+t:t};box.appendChild(b)});
    if(!arr.length)box.innerHTML='<span class="mu">Brak podpowiedzi.</span>';
  }catch(e){box.innerHTML='<span class="mu">Nie udało się pobrać podpowiedzi – użyj przycisku PONS.</span>'}
}
function addCard(){
  const f=$('#fr').value.trim(),b=$('#bk').value.trim();
  if(!f||!b){toast('Uzupełnij obie strony');return}
  S.cards.push({id:uid(),deck:$('#dk').value,front:f,back:b,imageEnabled:false,ease:2.5,int:0,reps:0,lapses:0,due:0});
  save();$('#fr').value='';$('#bk').value='';$('#sg').innerHTML='';plink();$('#fr').focus();toast('Dodano ✓');
}

function vCards(v){
  v.innerHTML=`<h2>Karty</h2><input id="q" placeholder="Szukaj…" oninput="renderCards()"><select id="fd" onchange="renderCards()"><option value="">Wszystkie decki</option>${deckOpts('')}</select><div id="ls"></div>
  <h3>Decki</h3><div id="dl"></div>
  <div class="row"><input id="nn" placeholder="Nazwa nowego decku"><select id="nl">${Object.entries(L).map(([k,x])=>`<option value="${k}">${x[0]}</option>`).join('')}</select></div>
  <button class="p" onclick="addDeck()">Utwórz deck</button>
  <h3>Zdania z lukami</h3><select id="cdk">${deckOpts('')}</select><p class="mu">Generator doda krótkie zdanie do kart, które jeszcze go nie mają.</p><button class="p" onclick="generateContexts()">✨ Wygeneruj zdania dla decku</button>
  <h3>Import CSV (np. z Noji)</h3><select id="idk">${deckOpts('')}</select><input id="cf" type="file" accept=".csv,.tsv,.txt,text/csv,text/plain"><div class="row"><input id="c1" type="number" value="1" min="1"><input id="c2" type="number" value="2" min="1"></div><p class="mu" style="margin-top:-4px">Numery kolumn: przód · tył</p><button class="p" onclick="importCSV()">Importuj</button>`;
  renderCards();dlist();
}
function renderCards(){
  if(!$('#q')||!$('#fd')||!$('#ls'))return;
  const q=$('#q').value.trim().toLocaleLowerCase('pl'),d=$('#fd').value;
  const a=S.cards.filter(c=>(!d||c.deck==d)&&(c.front+' '+c.back).toLocaleLowerCase('pl').includes(q));
  $('#ls').innerHTML=a.slice(0,200).map(c=>`<div class="it"><div><b>${esc(c.front)}</b><br><span class="mu">${esc(c.back)}</span></div><button aria-label="Edytuj fiszkę" onclick="editCard('${c.id}')">✎</button><button aria-label="Usuń fiszkę" onclick="delCard('${c.id}')">🗑</button></div>`).join('')||'<p class="mu">Brak kart.</p>';
}
function dlist(){
  $('#dl').innerHTML=S.decks.map(d=>`<div class="it"><div>${esc(d.name)} <span class="mu">· ${L[d.lang][0]} · ${S.cards.filter(c=>c.deck==d.id).length} kart</span></div><button onclick="delDeck('${d.id}')">🗑</button></div>`).join('');
}
async function generateContexts(){
  const deck=$('#cdk').value,d=S.decks.find(x=>x.id===deck),cards=S.cards.filter(c=>c.deck===deck&&!c.contextSentence);
  if(!cards.length){toast('Wszystkie karty w tym decku mają już zdanie');return}
  const bridge=window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.tr;
  if(!bridge){toast('Generator działa tylko w aplikacji');return}
  let done=0;
  for(const c of cards){
    toast(`Generuję ${done+1} z ${cards.length}…`);
    try{
      const sentence=await bridge.postMessage({action:'context',word:c.front,meaning:c.back,lang:d.lang});
      if(typeof sentence==='string'&&sentence.includes('{{'+c.front+'}}')){c.contextSentence=sentence;done++}
    }catch(e){}
  }
  save();toast(done?`Dodano zdań: ${done}`:'Generator jest niedostępny — włącz Apple Intelligence');
}
function modal(title,fields,ok){
  const m=document.createElement('div');m.id='md';
  m.innerHTML=`<div class="mb"><h3>${esc(title)}</h3>${fields.map(f=>`<textarea placeholder="${esc(f.ph||'')}">${esc(f.v||'')}</textarea>`).join('')}<div class="row"><button class="s" id="mc">Anuluj</button><button class="p" id="mo" style="margin:0">OK</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#mc').onclick=()=>m.remove();
  m.querySelector('#mo').onclick=()=>{const v=[...m.querySelectorAll('textarea')].map(x=>x.value);m.remove();ok(v)};
}
function editCard(id){
  const c=S.cards.find(x=>x.id==id);
  if(!c)return;
  modal('Edytuj fiszkę',[{v:c.front,ph:'Przód'},{v:c.back,ph:'Tył'}],v=>{if(!v[0].trim()||!v[1].trim()){toast('Obie strony muszą być uzupełnione');return}const front=v[0].trim();if(front!==c.front)delete c.imageUrl;c.front=front;c.back=v[1].trim();save();renderCards()});
}
function delCard(id){
  if(!S.cards.some(c=>c.id===id))return;
  modal('Usunąć fiszkę?',[],()=>{S.cards=S.cards.filter(c=>c.id!==id);if(sess)sess.q=sess.q.filter(x=>x!==id);save();renderCards();dlist();toast('Usunięto fiszkę')});
}
function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');
  const first=t.split('\n')[0],sep=[';','\t',','].map(s=>[s,first.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==sep){r.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
async function importCSV(){
  const fl=$('#cf').files[0];if(!fl){toast('Wybierz plik');return}
  const cl=s=>(s||'').replace(/<br\s*\/?>/gi,'; ').replace(/<[^>]+>/g,'').trim();
  const rows=parseCSV(await fl.text()),a=Math.max(1,+$('#c1').value||1)-1,b=Math.max(1,+$('#c2').value||2)-1,d=$('#idk').value;
  if(rows.length&&/^(front|back|przód|przod|tył|tyl|question|answer|term|definition|pytanie|odpowiedź)/i.test(cl(rows[0][a])))rows.shift();
  const have=new Set(S.cards.filter(c=>c.deck==d).map(c=>c.front.toLowerCase()));let n=0;
  rows.forEach(r=>{const x=cl(r[a]),y=cl(r[b]);if(x&&y&&!have.has(x.toLowerCase())){have.add(x.toLowerCase());S.cards.push({id:uid(),deck:d,front:x,back:y,ease:2.5,int:0,reps:0,lapses:0,due:0});n++}});
  save();toast('Zaimportowano: '+n);renderCards();dlist();
}
function addDeck(){
  const n=$('#nn').value.trim();if(!n)return;
  S.decks.push({id:uid(),name:n,lang:$('#nl').value});save();render();
}
function delDeck(id){
  if(S.decks.length<2){toast('Musi zostać co najmniej jeden deck');return}
  modal('Usunąć deck wraz z kartami?',[],()=>{S.decks=S.decks.filter(d=>d.id!=id);S.cards=S.cards.filter(c=>c.deck!=id);if(sd==id)sd='';save();render()});
}

function vStats(v){
  const C=S.cards,mast=C.filter(c=>c.int>=21).length,nw=C.filter(isNew).length,lr=C.length-mast-nw,today=(S.daily[dk(new Date())]||[]).length;
  let streak=0;const d=new Date();
  if(!S.log[dk(d)])d.setDate(d.getDate()-1);
  while(S.log[dk(d)]){streak++;d.setDate(d.getDate()-1)}
  const days=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);const key=dk(x);return[['nd','pn','wt','śr','cz','pt','sb'][x.getDay()],(S.daily[key]||[]).length]});
  const mx=Math.max(1,...days.map(x=>x[1]));
  v.innerHTML=`<h2>Postępy</h2><div class="st">
  <div class="c"><div class="n">${C.length}</div><span class="mu">wszystkich kart</span></div>
  <div class="c"><div class="n">${mast}</div><span class="mu">opanowane (≥21 dni)</span></div>
  <div class="c"><div class="n">${lr}</div><span class="mu">w trakcie nauki</span></div>
  <div class="c"><div class="n">${nw}</div><span class="mu">nowe</span></div>
  <div class="c"><div class="n">${streak}🔥</div><span class="mu">dni z rzędu</span></div>
  <div class="c"><div class="n">${due('').length}</div><span class="mu">do powtórki teraz</span></div>
  <div class="c"><div class="n">${today}</div><span class="mu">fiszek powtórzonych dziś</span></div></div>
  <div class="c"><b>Ostatnie 7 dni</b><div class="bars" style="margin-top:10px">${days.map(x=>`<div>${x[1]}<i style="height:${Math.round(x[1]/mx*60)}px"></i>${x[0]}</div>`).join('')}</div></div>
  <h3>Kopia zapasowa</h3><p class="mu">Dane są tylko w tej przeglądarce/aplikacji. Zrób kopię przed zmianą telefonu.</p>
  <div class="row"><button class="s" onclick="bkp()">Kopiuj kopię</button><button class="s" onclick="rst()">Wklej kopię</button></div>`;
}
async function bkp(){try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Skopiowano do schowka')}catch(e){modal('Skopiuj ten tekst ręcznie',[{v:JSON.stringify(S)}],()=>{})}}
function rst(){
  modal('Wklej kopię zapasową (zastąpi obecne dane)',[{ph:'Kopia'}],v=>{
    try{const o=JSON.parse(v[0]);if(!o.decks||!o.cards)throw 0;S=o;save();render();toast('Przywrócono')}catch(e){toast('Nieprawidłowa kopia')}
  });
}
render();Sync.init();
</script></body></html>
