<style>
:root {
  --bg: #f8f9fa;
  --sf: #ffffff;
  --sf-trans: rgba(255, 255, 255, 0.85);
  --tx: #111827;
  --mu: #6b7280;
  --ac: #4f46e5;
  --ac-grad: linear-gradient(135deg, #6366f1, #4f46e5);
  --bd: #e5e7eb;
  --shadow: 0 4px 20px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.1);
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --sf: #1c1c1e;
    --sf-trans: rgba(28, 28, 30, 0.85);
    --tx: #f9fafb;
    --mu: #9ca3af;
    --ac: #818cf8;
    --ac-grad: linear-gradient(135deg, #818cf8, #6366f1);
    --bd: #374151;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --sf: #1c1c1e;
  --sf-trans: rgba(28, 28, 30, 0.85);
  --tx: #f9fafb;
  --mu: #9ca3af;
  --ac: #818cf8;
  --ac-grad: linear-gradient(135deg, #818cf8, #6366f1);
  --bd: #374151;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; padding: 0;
  overflow: hidden;
  background: var(--bg); color: var(--tx);
  font: 16px/1.5 -apple-system, system-ui, "Helvetica Neue", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body {
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
main {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 20px; width: 100%; max-width: 600px; margin: 0 auto;
}
nav {
  display: flex; border-top: 1px solid var(--bd); background: var(--sf-trans);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  flex-shrink: 0; width: 100%; z-index: 10;
}
nav button {
  flex: 1; border: 0; background: none; color: var(--mu); padding: 12px 0 10px;
  font-size: 12px; transition: color 0.2s; font-weight: 600; cursor: pointer;
}
nav button b { display: block; font-size: 22px; font-weight: 400; margin-bottom: 4px; transition: transform 0.2s; }
nav button:active b { transform: scale(0.9); }
nav button.on { color: var(--ac); }

input, select, textarea {
  width: 100%; padding: 14px 16px; margin: 0 0 12px; border: 1px solid var(--bd);
  border-radius: 14px; background: var(--sf); color: var(--tx); font: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
textarea { min-height: 90px; resize: vertical; }
button { font: inherit; cursor: pointer; }

.p {
  width: 100%; padding: 16px; border: 0; border-radius: 14px; background: var(--ac-grad);
  color: #fff; font-weight: 700; margin: 6px 0 12px; box-shadow: 0 4px 12px rgba(79,70,229,0.3);
  transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s; display: flex; justify-content: center; align-items: center;
}
.p:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(79,70,229,0.2); }
.p:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
.s {
  padding: 12px 16px; border: 1px solid var(--bd); border-radius: 12px;
  background: var(--sf); color: var(--tx); font-weight: 600; transition: background 0.2s;
  display: flex; justify-content: center; align-items: center;
}
.s:active { background: var(--bd); }

.c { background: var(--sf); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card {
  background: var(--sf); border-radius: 24px; padding: 32px 24px; min-height: 280px;
  text-align: center; display: flex; flex-direction: column; justify-content: center;
  box-shadow: var(--shadow-lg); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  position: relative; overflow: hidden;
}
.card:active { transform: scale(0.98); }
.f { font-size: 32px; font-weight: 500; word-break: break-word; overflow-wrap: anywhere; hyphens: auto; letter-spacing: -0.02em; margin: 0; line-height: 1.25; }
.b { font-size: 24px; color: var(--ac); word-break: break-word; overflow-wrap: anywhere; hyphens: auto; font-weight: 500; margin-top: 8px; line-height: 1.3; }
.sentence { font-size: 24px; line-height: 1.5; word-break: break-word; overflow-wrap: anywhere; hyphens: auto; font-weight: 500;}
.blank { font-weight: 700; letter-spacing: 2px; border-bottom: 3px solid var(--ac); }
.hint, .prog, .mu { color: var(--mu); font-size: 14px; font-weight: 500;}
hr { width: 80%; border: 0; border-top: 1px dashed var(--bd); margin: 24px auto; }

.g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
.g button {
  padding: 16px 0; border: 0; border-radius: 14px; color: #fff; font-weight: 700;
  font-size: 14px; transition: transform 0.1s, opacity 0.1s;
}
.g button:active { transform: scale(0.95); opacity: 0.8; }

.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.it { display: flex; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--bd); }
.it div { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.it button { border: 0; background: none; font-size: 20px; padding: 8px; cursor: pointer; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.chips button {
  padding: 8px 14px; border: 1px solid var(--ac); border-radius: 20px; background: none;
  color: var(--ac); font-size: 14px; transition: background 0.2s; font-weight: 600; cursor: pointer;
}
.chips button:active { background: rgba(79,70,229,0.1); }

.bars { display: flex; align-items: flex-end; gap: 4px; height: 100px; }
.bars div { flex: 1; text-align: center; font-size: 11px; color: var(--mu); }
.bars i { display: block; background: var(--ac-grad); border-radius: 6px 6px 0 0; min-height: 2px; }
.n { font-size: 32px; font-weight: 800; letter-spacing: -1px;}
.st { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }

#t {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 100px;
  background: rgba(17, 24, 39, 0.9); color: #fff; padding: 12px 24px; border-radius: 30px;
  display: none; font-size: 14px; font-weight: 500; backdrop-filter: blur(8px); z-index: 100;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: slideUp 0.3s ease; text-align: center; white-space: nowrap;
}
@keyframes slideUp { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
a { color: var(--ac); text-decoration: none; font-weight: 600; }
h2 { margin: 0 0 20px; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
h3 { margin: 20px 0 10px; font-size: 18px; font-weight: 700; }

/* Tryb nauki (reviewing) */
body.reviewing main { max-width: none; padding: clamp(16px, 4vw, 42px); display: flex; flex-direction: column; }
body.reviewing #v { width: 100%; max-width: 900px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; justify-content: safe center; overflow-y: auto; }
body.reviewing .card { flex: 1; min-height: 50vh; overflow-y: auto; font-size: 1.15em; }
body.reviewing .card .f { font-size: clamp(32px, 6vw, 56px); }
body.reviewing .card .b { font-size: clamp(26px, 5vw, 44px); }
.review-image { display: block; max-width: 100%; max-height: 32vh; object-fit: contain; margin: 20px auto 0; border-radius: 16px; box-shadow: var(--shadow); }
body.reviewing nav { display: none; }
body.reviewing #t { bottom: 20px; }

/* Modal & Login */
#md, #login {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 20px; z-index: 50; overflow-y: auto;
}
#md { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.mb, #login .box {
  background: var(--sf); border-radius: 24px; padding: 28px; width: 100%; max-width: 420px;
  box-shadow: var(--shadow-lg); margin: auto; animation: scaleUp 0.2s ease;
}
@keyframes scaleUp { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

.mb.long { max-height: 80vh; overflow-y: auto; }
.mb h3 { margin-top: 0; font-size: 22px; }
.mb p, .mb ul { font-size: 15px; line-height: 1.6; color: var(--tx); }
.mb ul { padding-left: 20px; margin-bottom: 16px; }
.mb li { margin-bottom: 8px; }

#login { background: var(--bg); z-index: 60; }
#login .box { max-width: 400px; padding: 36px; border-radius: 28px; }
body.locked main, body.locked nav { display: none; }
body.locked #t { display: none !important; }

/* Password Toggle */
.pass-wrap { position: relative; }
.pass-wrap input { padding-right: 48px; margin-bottom: 16px;}
.pass-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-65%); border: 0; background: none; font-size: 20px; cursor: pointer; opacity: 0.5; padding: 4px;}
.pass-toggle:active { opacity: 1; }

// --- ADAPTACYJNY ROZMIAR CZCIONKI ---
function fitSize(text, base) {
  const len = (text || '').length;
  if (len <= 12) return base + 'px';
  if (len <= 20) return Math.round(base * 0.78) + 'px';
  if (len <= 30) return Math.round(base * 0.62) + 'px';
  if (len <= 45) return Math.round(base * 0.5) + 'px';
  if (len <= 60) return Math.round(base * 0.42) + 'px';
  if (len <= 90) return Math.round(base * 0.35) + 'px';
  return Math.round(base * 0.28) + 'px';
}

function migrateState(state) {
  if(!state) return false;
  let changed = false;
  if(state.daily) {
    Object.keys(state.daily).forEach(k => {
      if (Array.isArray(state.daily[k])) {
        state.daily[k] = state.daily[k].length;
        changed = true;
      }
    });
  }
  return changed;
}

    if(!Sync?.client){err.textContent=t('login.err.notConfig');return}
    if(!e||!e.includes('@')){err.textContent='Wpisz poprawny e-mail.';return}
    if(!p){err.textContent='Wpisz hasło.';return}
    if(signUp && p.length<6){err.textContent='Hasło musi mieć min. 6 znaków.';return}
    
    const btn = signUp ? $('#rbtn') : $('#lbtn');
    const orig = btn.textContent; btn.textContent = '⏳'; btn.disabled = true;
    
    const r=signUp?await Sync.client.auth.signUp({email:e,password:p}):await Sync.client.auth.signInWithPassword({email:e,password:p});
    
    btn.textContent = orig; btn.disabled = false;
    
    if(r.error){err.textContent=r.error.message;return}
    if(signUp&&!r.data.session){err.textContent=t('login.err.confirm');return}
    
    Sync.user=r.data.user||r.data.session?.user;

  };
  $('#lbtn').onclick=()=>go(false);
  $('#rbtn').onclick=()=>go(true);
  $('#lpass').onkeydown=e=>{if(e.key==='Enter')go(false)};
}

Sync={
  client:createSupabaseClient(),
  user:null,timer:0,
  async init(){
    if(!this.client){showLogin();return}
    const {data:{session}}=await this.client.auth.getSession();
    this.user=session?.user||null;
    if(!this.user){showLogin();return}
    await this.download(true);
    render();
    
    this.client.auth.onAuthStateChange(async(_e,s)=>{
      this.user=s?.user||null;
      if(this.user){await this.download(true);hideLogin();render()}
      else{showLogin();document.body.classList.add('locked')}
    });
  },
  async download(force=false){
    if(!this.client||!this.user)return false;
    const {data}=await this.client.from('app_states').select('state').eq('user_id',this.user.id).maybeSingle();
    
    if(data?.state){
      S=data.state;
      if(!S.settings)S.settings={...defaults};
      if(!S.daily)S.daily={};
      if(!S.ratings)S.ratings={};
      migrateState(S);
      localStorage.setItem('altcards-v1',JSON.stringify(S));
    } else {
      // Brak danych w chmurze – nowe konto
      S = { decks:[{id:'d1',name:'Hiszpański',lang:'es'}], cards:[], log:{} };
      S.settings = { ...defaults };
      S.daily = {};
      S.ratings = {};
      localStorage.setItem('altcards-v1',JSON.stringify(S));
      this.queueUpload();
    }
    render();
    return true;
  },
  queueUpload(){if(!this.client||!this.user)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.upload(),800)},
  async upload(){
    if(!this.client||!this.user||!S)return;
    if(S.cards.length===0){
      const {data}=await this.client.from('app_states').select('state').eq('user_id',this.user.id).maybeSingle();
      if(data?.state?.cards?.length>0){
        await this.download(true);
        return;
      }
    }
    await this.client.from('app_states').upsert({user_id:this.user.id,state:S,updated_at:new Date().toISOString()});
  },
  async signOut(){
    if(this.client)await this.client.auth.signOut();
    this.user=null;
    S = null;
    localStorage.removeItem('altcards-v1');
    showLogin();
    toast(t('settings.loggedOut'));
  },
  async executeDeleteAccount(){
    const btn = document.getElementById('delbtn');
    if(btn) { btn.textContent = '⏳'; btn.disabled = true; }

    try {
      const { error } = await this.client.rpc('delete_user_account');
      if(error){ 
        toast(error.message); 
        if(btn){btn.textContent = t('settings.deleteConfirmBtn'); btn.disabled = false;} 
        return; 
      }
      
      await this.client.auth.signOut();
      this.user=null;
      S = null;
      localStorage.removeItem('altcards-v1');
      document.getElementById('md')?.remove();
      showLogin();
      toast(t('settings.deleted'));
    } catch (e) {
      toast('Error: ' + e.message);
      if(btn){btn.textContent = t('settings.deleteConfirmBtn'); btn.disabled = false;}
    }
  }
};

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable)return;
  if($('#md')||$('#login'))return;
  if(tab!=='study'||!sess)return;
  if(!sess.q.length)return;
  const key=e.key.toLowerCase();
  const c=S.cards.find(x=>x.id==sess.q[0]);
  if(!c)return;
  if(key==='m'){say(c.id);e.preventDefault();return}
  if(!flip){
    if(key===' '||e.code==='Space'){e.preventDefault();flip=true;render();return}
    if(key==='o'){e.preventDefault();flip=true;revealImage(c.id);return}
    return;
  }
  if(key==='1'){e.preventDefault();ans(0)}
  else if(key==='2'){e.preventDefault();ans(1)}
  else if(key==='3'){e.preventDefault();ans(2)}
  else if(key==='4'){e.preventDefault();ans(3)}
  else if(key==='z'){e.preventDefault();undoAnswer()}
  else if(key==='o'){e.preventDefault();revealImage(c.id)}
});

  const a=due(sd),rev=a.filter(c=>!isNew(c)),nw=a.filter(isNew).slice(0,S.settings.newLimit);

function shuffleNewInDeck(){
  const pool=S.cards.map((c,i)=>({c,i})).filter(x=>(!sd||x.c.deck===sd)&&isNew(x.c));
  if(pool.length<2){toast(t('study.tooFewNew'));return}
  const shuffled=pool.map(x=>x.c);
  for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}
  pool.forEach((x,k)=>{S.cards[x.i]=shuffled[k]});
  save();
  toast(t('study.shuffled').replace('{n}',Math.min(S.settings.newLimit,pool.length)));
  render();
}
function say(id){
  const c=S.cards.find(x=>x.id==id),d=S.decks.find(x=>x.id==c.deck);
  try{
    const u=new SpeechSynthesisUtterance(c.front);
    u.lang=(L[d?.lang]||L['es']).tts;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}
function grade(c,g){
  if(g==0){c.lapses++;c.ease=Math.max(1.3,c.ease-.2);c.int=0;c.due=Date.now();return}
  if(g==1){c.ease=Math.max(1.3,c.ease-.15);c.int=Math.max(1,Math.round((c.int||1)*1.2))}
  if(g==2)c.int=c.int<1?1:c.int<2?3:Math.round(c.int*c.ease);
  if(g==3){c.ease+=.15;c.int=c.int<1?4:Math.round(c.int*c.ease*1.3)}
  c.reps++;c.due=sod()+c.int*864e5;
}
function ans(g){
  const id=sess.q[0],c=S.cards.find(x=>x.id==id);
  undoState={cardId:id,card:JSON.parse(JSON.stringify(c)),queue:[...sess.q],flip,log:JSON.parse(JSON.stringify(S.log)),daily:JSON.parse(JSON.stringify(S.daily)),ratings:JSON.parse(JSON.stringify(S.ratings||{}))};
  sess.q.shift();
  grade(c,g);
  const k=dk(new Date());S.log[k]=(S.log[k]||0)+1;
  if(!S.ratings)S.ratings={};
  if(!S.ratings[k])S.ratings[k]=[0,0,0,0];
  S.ratings[k][g]=(S.ratings[k][g]||0)+1;
  if(typeof S.daily[k] !== 'number') S.daily[k] = 0;
  S.daily[k]++;
  if(g==0)sess.q.splice(Math.min(3,sess.q.length),0,id);
  save();flip=false;imageRevealed=false;render();
}

    if(!pages.length){host.textContent=t('sess.imgNotFound');return}

    host.innerHTML=`<img class="review-image" alt="${esc(c.front)}" src="${esc(best)}"><div class="mu">${t('sess.imgCredit')}</div>`;
  }catch(e){host.textContent=t('sess.imgError')}

function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');
  const first=t.split('\n')[0],sep=[';','\t',','].map(s=>[s,first.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==sep){r.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}
  return rows.filter(r=>r.some(x=>x.trim()));
}

  const fl=$('#cf').files[0];if(!fl){toast(t('cards.selectFile'));return}
  const cl=s=>(s||'').replace(/<br\s*\/?>/gi,'; ').replace(/<[^>]+>/g,'').trim();
  const rows=parseCSV(await fl.text()),a=Math.max(1,+$('#c1').value||1)-1,b=Math.max(1,+$('#c2').value||2)-1,d=$('#idk').value;
  if(rows.length&&/^(front|back|przód|przod|tył|tyl|question|answer|term|definition|pytanie|odpowiedź)/i.test(cl(rows[0][a])))rows.shift();
  const have=new Set(S.cards.filter(c=>c.deck==d).map(c=>c.front.toLowerCase()));let n=0;
  rows.forEach(r=>{const x=cl(r[a]),y=cl(r[b]);if(x&&y&&!have.has(x.toLowerCase())){have.add(x.toLowerCase());S.cards.push({id:uid(),deck:d,front:x,back:y,ease:2.5,int:0,reps:0,lapses:0,due:0});n++}});
  save();toast(t('cards.imported').replace('{n}',n));renderCards();dlist();
}
function addDeck(){
  const n=$('#nn').value.trim();if(!n)return;
  S.decks.push({id:uid(),name:n,lang:$('#nl').value});save();render();
}
function delDeck(id){
  if(S.decks.length<2){toast(t('cards.keepOneDeck'));return}
  modal(t('cards.deleteDeck'),[],()=>{S.decks=S.decks.filter(d=>d.id!=id);S.cards=S.cards.filter(c=>c.deck!=id);if(sd==id)sd='';save();render()});
}

function vStats(v){
  const C=S.cards,todayKey=dk(new Date());
  const mast=C.filter(c=>c.int>=21).length,nw=C.filter(isNew).length,lr=C.length-mast-nw;
  const today = Array.isArray(S.daily[todayKey]) ? S.daily[todayKey].length : (S.daily[todayKey] || 0);
  const reviewedEver=C.filter(c=>c.reps>0).length;
  let streak=0;const d=new Date();
  if(!S.log[dk(d)])d.setDate(d.getDate()-1);
  while(S.log[dk(d)]){streak++;d.setDate(d.getDate()-1)}
  const activeKeys=Object.keys(S.log).filter(k=>S.log[k]>0).sort();
  let longest=0,cur=0,prev=null;
  activeKeys.forEach(k=>{
    if(prev){const diff=Math.round((new Date(k+'T00:00:00')-new Date(prev+'T00:00:00'))/864e5);cur=diff===1?cur+1:1}
    else cur=1;
    if(cur>longest)longest=cur;prev=k;
  });
  const R=S.ratings||{};
  let tA=0,tH=0,tG=0,tE=0;
  Object.values(R).forEach(a=>{tA+=(a[0]||0);tH+=(a[1]||0);tG+=(a[2]||0);tE+=(a[3]||0)});
  const totalReviews=tA+tH+tG+tE;
  const retention=totalReviews?Math.round((tG+tE)/totalReviews*100)+'%':'—';
  const activeDays=activeKeys.length;
  const chart=[...Array(30)].map((_,i)=>{
    const x=new Date();x.setDate(x.getDate()-29+i);const a=R[dk(x)]||[0,0,0,0];
    return a[0]+a[1]+a[2]+a[3];
  });
  const mx=Math.max(1,...chart);
  const perDeck=S.decks.map(deck=>{
    const dc=C.filter(c=>c.deck==deck.id);
    return {name:deck.name,total:dc.length,new:dc.filter(isNew).length,mastered:dc.filter(c=>c.int>=21).length};
  });
  const gb=(label,n,col)=>{
    const h=totalReviews?Math.round(n/Math.max(1,totalReviews)*80):0;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end"><div style="font-size:12px;color:var(--mu);margin-bottom:4px">${n}</div><div style="width:70%;background:${col};border-radius:4px 4px 0 0;min-height:2px;height:${h}px"></div><div style="font-size:11px;color:var(--mu);margin-top:4px">${label}</div></div>`;
  };
  v.innerHTML=`<h2>${t('stats.title')}</h2>
  <h3>${t('stats.now')}</h3>
  <div class="st">
    <div class="c"><div class="n">${C.length}</div><span class="mu">${t('stats.all')}</span></div>
    <div class="c"><div class="n">${mast}</div><span class="mu">${t('stats.mastered')}</span></div>
    <div class="c"><div class="n">${lr}</div><span class="mu">${t('stats.learning')}</span></div>
    <div class="c"><div class="n">${nw}</div><span class="mu">${t('stats.new')}</span></div>
    <div class="c"><div class="n">${due('').length}</div><span class="mu">${t('stats.dueNow')}</span></div>
    <div class="c"><div class="n">${today}</div><span class="mu">${t('stats.today')}</span></div>
  </div>
  <h3>${t('stats.total')}</h3>
  <div class="st">
    <div class="c"><div class="n">${totalReviews}</div><span class="mu">${t('stats.allAnswers')}</span></div>
    <div class="c"><div class="n">${reviewedEver}</div><span class="mu">${t('stats.reviewedCards')}</span></div>
    <div class="c"><div class="n">${retention}</div><span class="mu">${t('stats.retention')}</span></div>
    <div class="c"><div class="n">${activeDays}</div><span class="mu">${t('stats.daysTotal')}</span></div>
    <div class="c"><div class="n">${streak}🔥</div><span class="mu">${t('stats.streak')}</span></div>
    <div class="c"><div class="n">${longest}</div><span class="mu">${t('stats.longestStreak')}</span></div>
  </div>
  <div class="c"><b>${t('stats.byRating')}</b>
    <div style="display:flex;gap:8px;height:110px;margin-top:10px">
      ${gb(t('stats.again'),tA,'#ef4444')}${gb(t('stats.hard'),tH,'#f59e0b')}${gb(t('stats.good'),tG,'#10b981')}${gb(t('stats.easy'),tE,'#3b82f6')}
    </div>
  </div>
  <div class="c"><b>${t('stats.last30')}</b><div class="bars" style="margin-top:10px;height:70px;gap:2px">${chart.map(n=>`<div><i style="height:${Math.round(n/mx*50)}px"></i></div>`).join('')}</div></div>
  <h3>${t('stats.perDeck')}</h3>
  ${perDeck.map(deck=>`<div class="it"><div><b>${esc(deck.name)}</b><br><span class="mu">${t('stats.deckLine').replace('{total}',deck.total).replace('{new}',deck.new).replace('{mastered}',deck.mastered)}</span></div></div>`).join('')||`<p class="mu">${t('cards.noCards')}</p>`}
  <h3>${t('stats.backup')}</h3><p class="mu">${t('stats.backupInfo')}</p>
  <div class="row"><button class="s" onclick="bkp()">${t('stats.copyBackup')}</button><button class="s" onclick="rst()">${t('stats.pasteBackup')}</button></div>`;
}
async function bkp(){
  try{await navigator.clipboard.writeText(JSON.stringify(S));toast(t('stats.copied'))}
  catch(e){modal(t('stats.manualCopyTitle'),[{v:JSON.stringify(S)}],()=>{})}
}
function rst(){
  modal(t('stats.pasteTitle'),[{ph:t('stats.pastePlaceholder')}],v=>{
    try{const o=JSON.parse(v[0]);if(!o.decks||!o.cards)throw 0;S=o;save();render();toast(t('stats.restored'))}
    catch(e){toast(t('stats.invalidBackup'))}
  });
}

async function forceSyncFromCloud(){
  if(!Sync?.user)return;
  if(!confirm("To nadpisze dane na tym urządzeniu danymi z chmury. Kontynuować?"))return;
  await Sync.download(true);
  toast('Pobrano dane z chmury');
}

render();Sync.init();
</script></body></html>
