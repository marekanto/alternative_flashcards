name: AI Development

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Zadanie dla agenta (PL/EN)'
        required: true
        type: string
      allow_sensitive:
        description: 'Pozwól zmieniać SRS/XP/Sync (ochrona)'
        required: false
        default: false
        type: boolean
      diagnose_only:
        description: 'Tylko diagnoza (bez patcha, bez PR)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test (builder context)
        run: python -B tests/smoke_test.py

      - name: Run agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TASK: ${{ inputs.task }}
          ALLOW_SENSITIVE_CHANGES: ${{ inputs.allow_sensitive }}
          DIAGNOSE_ONLY: ${{ inputs.diagnose_only }}
          QA_MAX_ATTEMPTS: '3'
          DEEPSEEK_MODEL: 'deepseek-chat'
        run: python -B agent/orchestrator.py

      # --- AUTO-MERGE: create PR then merge immediately ---
      - name: Commit + PR + auto-merge
        if: success() && inputs.diagnose_only == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes — skipping commit"
            exit 0
          fi

          BRANCH="ai/deepseek-${GITHUB_RUN_ID}"

          git config user.name "AltCards Agent"
          git config user.email "agent@altcards.local"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "AI: ${{ inputs.task }}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "AI: ${{ inputs.task }}" \
            --body "Automated patch by AltCards agent.

          **Task:** \`${{ inputs.task }}\`

          QA passed. Auto-merging.")

          echo "Created PR: $PR_URL"

          # Czekaj aż PR będzie mergeable (status checks)
          for i in $(seq 1 30); do
            STATE=$(gh pr view "$BRANCH" --json mergeable --jq '.mergeable')
            if [ "$STATE" = "MERGEABLE" ]; then
              break
            fi
            echo "Waiting for PR to be mergeable (state=$STATE, attempt $i)..."
            sleep 5
          done

          # Merge (squash) i usuń branch
          gh pr merge "$BRANCH" --squash --delete-branch --admin || \
            gh pr merge "$BRANCH" --squash --delete-branch

          echo "✓ Merged $BRANCH into main"
