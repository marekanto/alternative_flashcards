name: AI Development

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Zadanie dla agenta (PL/EN)'
        required: true
        type: string
      allow_sensitive:
        description: 'Pozwól zmieniać SRS/XP/Sync (ochrona)'
        required: false
        default: false
        type: boolean
      diagnose_only:
        description: 'Tylko diagnoza (bez patcha, bez PR)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test (builder context)
        run: python -B tests/smoke_test.py

      - name: Run agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TASK: ${{ inputs.task }}
          ALLOW_SENSITIVE_CHANGES: ${{ inputs.allow_sensitive }}
          DIAGNOSE_ONLY: ${{ inputs.diagnose_only }}
          QA_MAX_ATTEMPTS: '3'
          DEEPSEEK_MODEL: 'deepseek-chat'
          # DEEPSEEK_THINKING celowo pominięte → settings.py daje "disabled"
          # task_refiner jawnie włącza thinking dla siebie.
        run: python -B agent/orchestrator.py

      - name: Create Pull Request
        if: success() && inputs.diagnose_only == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet && echo "No changes — skipping PR" && exit 0
          BRANCH="ai/deepseek-${GITHUB_RUN_ID}"
          git config user.name "AltCards Agent"
          git config user.email "agent@altcards.local"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "AI: ${{ inputs.task }}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "AI: ${{ inputs.task }}" \
            --body "Automated patch by AltCards agent.

          **Task:** \`${{ inputs.task }}\`

          Review the diff carefully before merging."
